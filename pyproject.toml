[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autobahn-mcp"
version = "0.1.0"
description = "Unofficial read-only MCP server for the German Autobahn (verkehr.autobahn.de) — roadworks, closures, warnings, parking & EV charging"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "httpx>=0.27",
]
authors = [{ name = "Mohammad Abbasi" }]

[project.scripts]
autobahn-mcp = "autobahn_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autobahn_mcp"]

[tool.pytest.ini_options]
markers = ["live: tests that hit the real https://verkehr.autobahn.de site"]
